# Degraded-GPU test on node2: graphics clock locked at 1200 MHz (max 2115)
# by the wrapper that runs this spec. Same shapes as the PP=1 baseline.

[experiment]
name = "qwen7b-static-node2-clock1200"
description = "Static-batch medians on node2 with the GPU graphics clock locked at 1200 MHz."
mode = "static-batch"
lab = "../labs/rtx3090.toml"
nodes = ["node2"]
launch = "auto"            # node2 default: venv
vllm_version = "0.29.0"

[model]
hf_id = "Qwen/Qwen2.5-7B-Instruct"
name = "qwen2.5-7b-instruct"
dtype = "bfloat16"
max_model_len = 4096

# The simulator's [model] section. ffn_hidden_size is the real MLP width
# (config.json intermediate_size); without it the simulator derives FLOPs
# from a 4x-hidden default and miscounts compute (see
# lab-runs/2026-09-30-recalibration/).
[model.sim]
layers = 28
hidden_size = 3584
attention_heads = 28
kv_heads = 4
ffn_hidden_size = 18944
vocab_size = 152064
parameters_gb = 15.23
dtype = "bf16"

[parallelism]
tp = 1
pp = 1

[engine]
gpu_memory_utilization = 0.85
max_num_batched_tokens = 16384
max_num_seqs = 64
enable_prefix_caching = false
enforce_eager = false
seed = 0

[static_batch]
shapes = ["1x512", "1x2048", "8x512", "8x2048", "32x512"]
decode_tokens = 128
warmup = 2
iters = 5

[runner]
poll_interval_s = 15
run_timeout_s = 3600
