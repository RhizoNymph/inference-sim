schema_version = 1
# The lab cluster (tools/lab/labs/rtx3090_cluster.toml) with peak_f16_tflops
# set from measured dense bf16 GEMM throughput instead of the datasheet:
# lab-runs/2026-11-02-gemm-peak/ (torch bf16 at Qwen2.5-7B prefill shapes,
# best case): node0 136.8, node1 121.9 TFLOP/s. node2 was not measured and
# keeps the datasheet-derived 88. Against 88, node1's Nov prefills need
# compute_efficiency > 1 (ledger 26), which the curve fit rejects.

# Three single-RTX-3090 nodes (node0/node1/node2) on a 2x10GbE LACP bond.
# 3090 has no preset: base a100_40gb, overridden with 3090 specs.
[cluster]
preset = "custom"

[interconnect]
kind = "ethernet"
variant = "10g"
oversubscription = 1.0

[[nodes]]
id = 0
gpu = "a100_40gb"
gpu_count = 1
hbm_gb = 24.0
hbm_bandwidth_gb_s = 936.0
peak_f16_tflops = 136.8
intra = "pcie_gen4"
nics = { count = 1, affinity = "uniform", bandwidth_gbps = 9.41, rail_count = 1 }

[[nodes]]
id = 1
gpu = "a100_40gb"
gpu_count = 1
hbm_gb = 24.0
hbm_bandwidth_gb_s = 936.0
peak_f16_tflops = 121.9
intra = "pcie_gen4"
nics = { count = 1, affinity = "uniform", bandwidth_gbps = 9.41, rail_count = 1 }

[[nodes]]
id = 2
gpu = "a100_40gb"
gpu_count = 1
hbm_gb = 24.0
hbm_bandwidth_gb_s = 936.0
peak_f16_tflops = 88.0
intra = "pcie_gen4"
nics = { count = 1, affinity = "uniform", bandwidth_gbps = 9.41, rail_count = 1 }
