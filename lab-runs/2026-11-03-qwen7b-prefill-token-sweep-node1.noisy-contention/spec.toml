# Compute recalibration on node1 (2026-11): batch-1 prefill sweep 16-4096
# tokens, repeating the node0 sweep that fitted the efficiency curve
# (rtx3090_qwen7b_prefill_token_sweep.toml) in the GPUs' current state.
# Ledger 26: the Sep/Oct runs that fitted every compute calibration ran
# prefill ~1.7x slower than the GPUs do now.

[experiment]
name = "qwen7b-prefill-token-sweep-node1"
description = "Batch-1 prefill across prompt lengths 16-4096 on node1: tokens-per-step compute efficiency for the recalibration."
mode = "static-batch"
lab = "../labs/rtx3090.toml"
nodes = ["node1"]
launch = "auto"            # node1 default: venv
vllm_version = "0.29.0"

[model]
hf_id = "Qwen/Qwen2.5-7B-Instruct"
name = "qwen2.5-7b-instruct"
dtype = "bfloat16"
max_model_len = 4352

# The simulator's [model] section. ffn_hidden_size is the real MLP width
# (config.json intermediate_size); without it the simulator derives FLOPs
# from a 4x-hidden default and miscounts compute (see
# lab-runs/2026-09-30-recalibration/).
[model.sim]
layers = 28
hidden_size = 3584
attention_heads = 28
kv_heads = 4
ffn_hidden_size = 18944
vocab_size = 152064
parameters_gb = 15.23
dtype = "bf16"

[parallelism]
tp = 1
pp = 1

[engine]
gpu_memory_utilization = 0.85
max_num_batched_tokens = 16384
max_num_seqs = 64
enable_prefix_caching = false
enforce_eager = false
seed = 0

[static_batch]
shapes = ["1x16", "1x32", "1x64", "1x128", "1x256", "1x512", "1x1024", "1x2048", "1x4096"]
decode_tokens = 128
warmup = 2
iters = 5

[runner]
poll_interval_s = 15
run_timeout_s = 3600
