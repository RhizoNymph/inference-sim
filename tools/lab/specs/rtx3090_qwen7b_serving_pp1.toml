# Online serving, Qwen2.5-7B-Instruct bf16 on one RTX 3090 (node0).
# Reproduces lab-runs/2026-09-30-serving-baseline/ (run_serving.sh there is
# the hand-written script this spec generalises): vLLM server in the node0
# container as the ssh user, `vllm bench serve` client from the node0 venv.

[experiment]
name = "qwen7b-serving-pp1"
description = "vllm bench serve, random 512-in / 128-out, Poisson arrivals, rate sweep."
mode = "serving"
lab = "../labs/rtx3090.toml"
nodes = ["node0"]
launch = "auto"            # server: node0 docker; client: node0 venv
vllm_version = "0.29.0"

[model]
hf_id = "Qwen/Qwen2.5-7B-Instruct"
name = "qwen2.5-7b-instruct"
dtype = "bfloat16"
max_model_len = 4096

[model.sim]
layers = 28
hidden_size = 3584
attention_heads = 28
kv_heads = 4
ffn_hidden_size = 18944
vocab_size = 152064
parameters_gb = 15.23
dtype = "bf16"

[parallelism]
tp = 1
pp = 1

[engine]
gpu_memory_utilization = 0.85
max_num_batched_tokens = 2048   # chunked-prefill token budget per step
max_num_seqs = 64
enable_prefix_caching = false
enforce_eager = false
seed = 0

[serving]
input_len = 512
output_len = 128
request_rates = [1, 2, 4, 6, 8, 10, "inf"]
num_prompts = 200
seed = 0
burstiness = 1.0               # 1.0 = Poisson
port = 8000
ready_timeout_s = 900
# Simulator side: same request count as the benchmark. The workload is
# colocated with continuous prefill and decode batching, so the simulator runs
# it on its iteration engine, which prices every step from its own
# composition; the [request] reference batch only sizes the static
# feasibility/memory scores, so 1 is enough (see docs/features/lab_harness.md).
sim_request_count = 200
sim_reference_batch = 1
# "engine" = vLLM's max_num_seqs and KV capacity; the simulator queues past
# them like vLLM. "uncapped" lifts both to the request count (what-if only).
sim_admission = "engine"
# KV capacity comes from the run's server.log ("GPU KV cache size") when
# present; set kv_cache_tokens to override.

[runner]
poll_interval_s = 15
run_timeout_s = 3600
