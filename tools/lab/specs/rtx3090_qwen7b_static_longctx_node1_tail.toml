# Remaining long-context shapes on node1 (2026-11-03 recalibration hold-out):
# the full spec (rtx3090_qwen7b_static_longctx_node1.toml, gpu_memory_utilization
# 0.90) ran out of memory at 1x16384 while another service held 2 GB of the GPU.
# 0.85 leaves room for the 16k-token prefill's activations; KV capacity still
# exceeds the largest shape.

[experiment]
name = "qwen7b-static-longctx-node1-tail"
description = "Static-batch medians at 4k-16k prompts, single GPU on node1."
mode = "static-batch"
lab = "../labs/rtx3090.toml"
nodes = ["node1"]
launch = "auto"            # node1 default: venv
vllm_version = "0.29.0"

[model]
hf_id = "Qwen/Qwen2.5-7B-Instruct"
name = "qwen2.5-7b-instruct"
dtype = "bfloat16"
max_model_len = 16640

# The simulator's [model] section. ffn_hidden_size is the real MLP width
# (config.json intermediate_size); without it the simulator derives FLOPs
# from a 4x-hidden default and miscounts compute (see
# lab-runs/2026-09-30-recalibration/).
[model.sim]
layers = 28
hidden_size = 3584
attention_heads = 28
kv_heads = 4
ffn_hidden_size = 18944
vocab_size = 152064
parameters_gb = 15.23
dtype = "bf16"

[parallelism]
tp = 1
pp = 1

[engine]
gpu_memory_utilization = 0.85
max_num_batched_tokens = 16384
max_num_seqs = 64
enable_prefix_caching = false
enforce_eager = false
seed = 0

[static_batch]
shapes = ["1x16384", "2x8192", "4x4096"]
decode_tokens = 128
warmup = 2
iters = 5

[runner]
poll_interval_s = 15
run_timeout_s = 3600
