# RTX 3090 lab (node0/node1/node2, one GPU each, 2x10GbE LACP bond) with the
# measured network: node0's NIC egress capped at the measured single-stream
# node0->node1 rate and the measured [[collective_curves]] (all_reduce over
# nodes 0+1, directed send_recv 0->1 and 1->0).
#
# Copied from lab-runs/2026-09-30-tp2/rtx3090_lab_cluster_measured_curves.toml
# (generated by `tools/lab/lab.py curves`), with peak_f16_tflops = 88 like
# tools/lab/labs/rtx3090_cluster.toml (datasheet 71 TFLOPs at 1695 MHz scaled
# to the measured 2100 MHz max SM clock), which the recalibrated constants in
# examples/rtx3090_qwen7b_disaggregated_workload.toml assume.

schema_version = 1

# Three single-RTX-3090 nodes (node0/node1/node2) on a 2x10GbE LACP bond.
# node0 NIC line rate 9.41 Gb/s with egress capped at the measured single-stream
# node0->node1 rate (3.61 Gb/s); node1->node0 runs at line rate.
# 3090 has no preset: base a100_40gb, overridden with 3090 specs.
[cluster]
preset = "custom"

[interconnect]
kind = "ethernet"
variant = "10g"
oversubscription = 1.0

[[nodes]]
id = 0
gpu = "a100_40gb"
gpu_count = 1
hbm_gb = 24.0
hbm_bandwidth_gb_s = 936.0
peak_f16_tflops = 88.0
intra = "pcie_gen4"
nics = { count = 1, affinity = "uniform", bandwidth_gbps = 9.41, egress_bandwidth_gbps = 3.61, rail_count = 1 }

[[nodes]]
id = 1
gpu = "a100_40gb"
gpu_count = 1
hbm_gb = 24.0
hbm_bandwidth_gb_s = 936.0
peak_f16_tflops = 88.0
intra = "pcie_gen4"
nics = { count = 1, affinity = "uniform", bandwidth_gbps = 9.41, rail_count = 1 }

[[nodes]]
id = 2
gpu = "a100_40gb"
gpu_count = 1
hbm_gb = 24.0
hbm_bandwidth_gb_s = 936.0
peak_f16_tflops = 88.0
intra = "pcie_gen4"
nics = { count = 1, affinity = "uniform", bandwidth_gbps = 9.41, rail_count = 1 }

# Measured collective curves, generated by `tools/lab/lab.py curves`.
# Source: lab-runs/2026-09-30-nccl-curve/collective_curve.jsonl
# rank 0 -> node 0, rank 1 -> node 1. Points are [message_bytes_per_rank, latency_us].
# Legacy two-rank benchmark: only rank 0 timed, so send_0to* rows are sender-timed and were screened.

# all_reduce: 2 ranks over nodes [0, 1]; 19 measured points, rank 0's clock only (legacy two-rank benchmark).
[[collective_curves]]
op = "all_reduce"
scope = "node_group"
nodes = [0, 1]
ranks = 2
source = "lab-runs/2026-09-30-nccl-curve/collective_curve.jsonl"
points = [
  [1024, 132.66],
  [2048, 133.47],
  [4096, 139.89],
  [8192, 166.25],
  [16384, 195.40],
  [32768, 225.57],
  [65536, 371.83],
  [131072, 370.47],
  [262144, 511.81],
  [524288, 913.53],
  [1048576, 1810.21],
  [2097152, 3419.63],
  [4194304, 7541.45],
  [8388608, 14247.34],
  [16777216, 33489.13],
  [33554432, 72770.39],
  [67108864, 148982.24],
  [134217728, 300730.94],
  [268435456, 561976.72],
]

# send_0to1: rank 0 (node 0) -> rank 1 (node 1); sender-timed; 3 of 19 measured rows kept.
# Dropped 16 sender-timed rows: the send returned before delivery (implied
# bandwidth > 1.25x the largest message's 0.357 GB/s up to 33554432 bytes; every
# smaller sender-timed row goes too). Dropped message bytes:
#   1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072
#   262144, 524288, 1048576, 2097152, 4194304, 8388608, 16777216, 33554432
# Points below 67108864 bytes are derived from send_1to0: t(b) = t_rev(b) + b * (1/bw_fwd - 1/bw_rev),
# bw_fwd = 0.364 GB/s, bw_rev = 1.177 GB/s (marginal bandwidth of each direction's two largest kept rows).
[[collective_curves]]
op = "send_recv"
scope = "node_pair"
src_node = 0
dst_node = 1
source = "lab-runs/2026-09-30-nccl-curve/collective_curve.jsonl"
derived_below_bytes = 67108864
points = [
  [1024, 151.81],
  [2048, 150.12],
  [4096, 162.66],
  [8192, 181.79],
  [16384, 201.48],
  [32768, 257.41],
  [65536, 355.07],
  [131072, 546.40],
  [262144, 910.17],
  [524288, 1640.01],
  [1048576, 3085.14],
  [2097152, 5969.50],
  [4194304, 11721.51],
  [8388608, 23219.55],
  [16777216, 46267.16],
  [33554432, 92344.96],
  [67108864, 194939.89],
  [134217728, 383856.50],
  [268435456, 752233.10],
]

