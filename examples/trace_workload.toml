schema_version = 1

[model]
id = "140GB bf16 transformer"
layers = 80
hidden_size = 8192
attention_heads = 64
kv_heads = 8
vocab_size = 128256
parameters_gb = 140.0
dtype = "bf16"

[request]
batch_size = 1
prompt_tokens = 1024
decode_tokens = 16
max_sequence_tokens = 2048
phase = "end_to_end"

[calibration_profile]
path = "calibration_h100_a100.toml"

[calibration]
serving_pipeline_depth = 4

[calibration_policy]
valid_shape = "reject"
invalid_shape = "reject"
coverage = "warn"
fit_confidence = "warn"
fit_extrapolation = "warn"
fit_partially_bounded = "warn"
fit_unbounded = "reject"
profile_runtime = "warn"
min_coverage_score = 0.50
min_fit_confidence_score = 0.50
min_fit_confidence_level = 0.90
uncertainty_ranking_weight = 1.0
require_phase_coverage = true

[search]
tensor_ranks = [1, 2, 4]
pipeline_ranks = [1]
expert_ranks = [1]
data_ranks = [1]

[serving]
mode = "disaggregated"
objective = "slo_miss_rate"
slo_miss_penalty_weight = 0.50
ttft_slo_miss_penalty_weight = 1.00
tpot_slo_miss_penalty_weight = 0.75
itl_slo_miss_penalty_weight = 0.75
e2el_slo_miss_penalty_weight = 1.25
deadline_miss_penalty_weight = 2.00

[[serving.pool_candidates]]
label = "h100-prefill-a100-decode"
prefill_groups = ["h100"]
decode_groups = ["a100"]

[[serving.traffic_classes]]
name = "tenant-a-interactive"
group = "tenant"
key = "tenant-a"
admission_priority = 5
max_prefill_tokens = 4096
max_decode_sequences = 4
max_resident_tokens = 16384
max_kv_blocks = 2048
ttft_slo_ms = 150.0
tpot_slo_ms = 80.0
itl_slo_ms = 80.0
e2el_slo_ms = 900.0
max_queue_delay_ms = 250.0
request_timeout_ms = 2000.0
slo_miss_penalty_weight = 0.25
ttft_slo_miss_penalty_weight = 1.00
e2el_slo_miss_penalty_weight = 1.50
max_ttft_slo_miss_rate = 0.05
max_tpot_slo_miss_rate = 0.05
max_itl_slo_miss_rate = 0.05
max_e2el_slo_miss_rate = 0.05
max_deadline_miss_rate = 0.05

[[serving.slo_policies]]
group = "model_id"
key = "llama-70b"
max_e2el_slo_miss_rate = 0.05

[[serving.traffic_classes]]
name = "priority-1-fast-lane"
group = "priority"
priority = 1
admission_priority = 10
ttft_slo_ms = 175.0
e2el_slo_ms = 1200.0
max_queue_delay_ms = 200.0
request_timeout_ms = 2500.0
slo_miss_penalty_weight = 0.10
ttft_slo_miss_penalty_weight = 0.75
e2el_slo_miss_penalty_weight = 1.00
max_ttft_slo_miss_rate = 0.05
max_e2el_slo_miss_rate = 0.05
max_deadline_miss_rate = 0.05
deadline_miss_penalty_weight = 2.00

[serving.traffic]
request_count = 4
routing_policy = "topology_aware"
prefill_batching = "continuous"
max_prefill_batch_tokens = 4096
max_prefill_chunk_tokens = 512
max_prefill_tokens = 8192
max_prefill_tokens_per_node = 8192
max_prefill_tokens_per_gpu = 4096
max_prefill_worker_slots_per_gpu = 2
decode_batching = "continuous"
decode_capacity_policy = "request_reject"
max_decode_batch_tokens = 16
max_decode_sequences = 8
max_resident_tokens = 32768
max_decode_sequences_per_node = 8
max_resident_tokens_per_node = 32768
max_decode_sequences_per_gpu = 4
max_decode_worker_slots_per_gpu = 2
max_resident_tokens_per_gpu = 8192
max_kv_transfer_worker_slots_per_gpu = 2
kv_block_tokens = 16
max_kv_blocks = 4096
max_kv_blocks_per_node = 4096
max_kv_blocks_per_gpu = 1024
ttft_slo_ms = 200.0
tpot_slo_ms = 50.0
itl_slo_ms = 50.0
e2el_slo_ms = 1000.0
max_ttft_slo_miss_rate = 0.05
max_kv_queue_delay_ms = 500.0
max_tpot_slo_miss_rate = 0.05
max_itl_slo_miss_rate = 0.05
max_e2el_slo_miss_rate = 0.05
max_deadline_miss_rate = 0.05
max_queue_delay_ms = 500.0
max_decode_queue_delay_ms = 500.0
max_decode_iteration_queue_delay_ms = 500.0
request_timeout_ms = 10000.0
trace_csv = "request_trace.csv"
measurement_start_ms = 1.0
measurement_end_ms = 4.0

[serving.prefill_search]
tensor_ranks = [4, 8]
pipeline_ranks = [1, 2]
expert_ranks = [1]
data_ranks = [1]

[serving.decode_search]
tensor_ranks = [1, 2, 4]
pipeline_ranks = [1]
expert_ranks = [1]
data_ranks = [1]
