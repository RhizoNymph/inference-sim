validation_mean_abs_pct_error = 3.10
validation_max_abs_pct_error = 9.50
confidence_interval = 1.30
confidence_interval_pct = 4.80
confidence_level = 0.95
sample_count = 20
validation_sample_count = 5
source = "synthetic MVP calibration fixture"
notes = "Aggregate TPOT fit adjusts the reported summary metric used for serving ranking; per-token timings remain simulator timeline evidence."

