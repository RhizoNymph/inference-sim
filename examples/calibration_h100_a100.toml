feature_ranges = [
  { feature = "baseline_ms", min = 0.1, max = 500 },
  { feature = "decode_ms", min = 0.1, max = 500 },
  { feature = "decode_queue_ms", min = 0, max = 2000 },
]
r_squared = 0.962
adjusted_r_squared = 0.948
rmse = 0.90
rmse_pct = 3.10
