schema_version = 1

[profile]
name = "h100-a100-disaggregated-mvp"
hardware = "2x H100 SXM prefill nodes, 1x A100 80GB decode node"
fabric = "mixed NDR/HDR/Ethernet example fabric"
model = "140GB bf16 transformer"
dtype = "bf16"
serving_stack = "generic-continuous-batching"
backend_version = "generic-continuous-batching 0.1"
driver_version = "synthetic-driver-550"
cuda_version = "12.4"
nccl_version = "2.21"
ucx_version = "1.16"
kernel_settings = ["cuda_graphs=true", "paged_attention=true", "kv_block_tokens=16"]
environment_hash = "sha256:synthetic-mvp"
source = "synthetic MVP calibration"
date = "2026-05-25"
notes = "Example profile for exercising reusable calibration provenance."

[calibration]
compute_efficiency = 0.35
prefill_compute_scale = 1.0
decode_compute_scale = 1.25
decode_memory_bandwidth_scale = 0.85
collective_bandwidth_scale = 0.82
kv_transfer_scale = 1.1
scheduler_overhead_us = 25.0
allow_compute_comm_overlap = true

[valid_shape]
min_batch_size = 1
max_batch_size = 8
min_prompt_tokens = 128
max_prompt_tokens = 4096
min_decode_tokens = 1
max_decode_tokens = 128
min_sequence_tokens = 512
max_sequence_tokens = 8192

[[invalid_shapes]]
name = "uncalibrated-long-context"
reason = "Synthetic MVP profile has no benchmark evidence beyond 16k sequence tokens."
min_sequence_tokens = 16385

[[fits]]
name = "h100-prefill-latency-fit"
target = "prefill_ms"
phase = "prefill"
kind = "latency"
model = "linear"
unit = "ms"
intercept = 0.75
features = ["effective_prefill_tokens", "batch_size", "tensor_ranks", "pipeline_ranks"]
coefficients = [0.020, 0.250, -0.060, 0.400]
feature_ranges = [
  { feature = "effective_prefill_tokens", min = 128, max = 4096 },
  { feature = "batch_size", min = 1, max = 8 },
  { feature = "tensor_ranks", min = 1, max = 8 },
  { feature = "pipeline_ranks", min = 1, max = 2 },
]
r_squared = 0.982
adjusted_r_squared = 0.976
rmse = 1.10
rmse_pct = 2.80
mean_abs_pct_error = 2.10
max_abs_pct_error = 6.20
validation_rmse = 1.30
validation_rmse_pct = 3.20
validation_mean_abs_pct_error = 2.50
validation_max_abs_pct_error = 7.00
confidence_interval = 1.60
confidence_interval_pct = 4.00
confidence_level = 0.95
sample_count = 36
validation_sample_count = 8
source = "synthetic MVP calibration fixture"
notes = "Shape-dependent prefill latency fit. When loaded by the CLI, compatible linear fits override the scalar prefill estimate for the fitted phase."

[[fits]]
name = "a100-decode-latency-fit"
target = "decode_ms"
phase = "decode"
kind = "latency"
model = "linear"
unit = "ms"
intercept = 1.25
features = ["batch_size", "decode_tokens", "sequence_tokens", "tensor_ranks"]
coefficients = [0.500, 3.100, 0.002, -0.350]
feature_ranges = [
  { feature = "batch_size", min = 1, max = 8 },
  { feature = "decode_tokens", min = 1, max = 128 },
  { feature = "sequence_tokens", min = 512, max = 8192 },
  { feature = "tensor_ranks", min = 1, max = 4 },
]
r_squared = 0.971
adjusted_r_squared = 0.962
rmse = 2.50
rmse_pct = 3.00
mean_abs_pct_error = 2.00
max_abs_pct_error = 7.50
validation_rmse = 2.90
validation_rmse_pct = 3.60
validation_mean_abs_pct_error = 2.60
validation_max_abs_pct_error = 8.40
confidence_interval = 3.30
confidence_interval_pct = 4.50
confidence_level = 0.95
sample_count = 24
validation_sample_count = 6
source = "synthetic MVP calibration fixture"
notes = "Decode fit records the measured shape response and can override the scalar decode estimate when the fitted feature set is supported."

[[fits]]
name = "h100-a100-kv-transfer-fit"
target = "kv_transfer_ms"
phase = "kv_transfer"
kind = "transfer"
model = "linear"
unit = "ms"
intercept = 0.35
features = ["kv_transfer_gb", "rail_bandwidth_gbps", "hop_count"]
coefficients = [0.090, -0.001, 0.450]
feature_ranges = [
  { feature = "kv_transfer_gb", min = 0.10, max = 2.00 },
  { feature = "rail_bandwidth_gbps", min = 100, max = 400 },
  { feature = "hop_count", min = 1, max = 4 },
]
r_squared = 0.944
adjusted_r_squared = 0.931
rmse = 0.18
rmse_pct = 4.20
mean_abs_pct_error = 3.30
max_abs_pct_error = 8.00
validation_rmse = 0.22
validation_rmse_pct = 4.90
validation_mean_abs_pct_error = 3.90
validation_max_abs_pct_error = 8.80
confidence_interval = 0.27
confidence_interval_pct = 6.00
confidence_level = 0.95
sample_count = 18
validation_sample_count = 4
source = "synthetic MVP calibration fixture"
notes = "KV-transfer fit can override the topology-derived transfer duration while retaining the routed bottleneck labels."

[[fits]]
name = "serving-ttft-summary-fit"
target = "ttft_ms"
phase = "serving"
kind = "latency"
model = "linear"
unit = "ms"
intercept = 0.25
features = ["baseline_ms", "queue_ms", "kv_transfer_ms"]
coefficients = [1.020, 0.050, 0.020]
feature_ranges = [
  { feature = "baseline_ms", min = 1, max = 5000 },
  { feature = "queue_ms", min = 0, max = 2000 },
  { feature = "kv_transfer_ms", min = 0, max = 1000 },
]
r_squared = 0.958
adjusted_r_squared = 0.944
rmse = 1.80
rmse_pct = 3.60
mean_abs_pct_error = 2.90
max_abs_pct_error = 9.10
validation_rmse = 2.10
validation_rmse_pct = 4.20
validation_mean_abs_pct_error = 3.40
validation_max_abs_pct_error = 10.20
confidence_interval = 2.60
confidence_interval_pct = 5.20
confidence_level = 0.95
sample_count = 20
validation_sample_count = 5
source = "synthetic MVP calibration fixture"
notes = "Aggregate TTFT fit adjusts the reported summary metric used for serving ranking; per-request traces remain simulator timeline evidence."

[[fits]]
name = "serving-tpot-summary-fit"
target = "tpot_ms"
phase = "serving"
kind = "latency"
model = "linear"
unit = "ms"
